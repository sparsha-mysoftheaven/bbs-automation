name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      DISPLAY: :99 # Applies to ALL steps across the job

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx playwright install chromium --with-deps

      - name: Install Xvfb, x11vnc, and fluxbox
        run: sudo apt-get update && sudo apt-get install -y xvfb x11vnc fluxbox net-tools

      - name: Start Xvfb, Fluxbox, and x11vnc
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1280x720x24 &>/tmp/xvfb.log &
          sleep 2

          # Start lightweight window manager
          fluxbox &>/tmp/fluxbox.log &
          sleep 1

          # Start VNC server (port 5900)
          x11vnc -display :99 -nopw -forever -shared -rfbport 5900 &>/tmp/x11vnc.log &
          sleep 1

      - name: Start tmate interactive session (before tests)
        uses: mxschmitt/action-tmate@v3
        with:
          wait-for-connection: true

      - name: Run Playwright tests (headed)
        run: npx playwright test tests/sidebarNavigation.spec.ts --headed --timeout=120000

      - name: Setup tmate session on failure
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() }}
        with:
          limit-access-to-actor: false
