name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx playwright install chromium --with-deps

      - name: Install Xvfb, x11vnc, fluxbox, and xvfb-run
        run: sudo apt-get update && sudo apt-get install -y xvfb x11vnc fluxbox net-tools

      - name: Start virtual display and window manager
        run: |
          export DISPLAY=:99
          Xvfb $DISPLAY -screen 0 1280x720x24 &>/tmp/xvfb.log & sleep 1
          # start a lightweight WM so windows can be shown
          DISPLAY=$DISPLAY fluxbox &>/tmp/fluxbox.log & sleep 1

      - name: Start x11vnc server on display :99
        run: |
          export DISPLAY=:99
          # -nopw for no password (temporary runner); -forever keeps server up; -shared allows multiple clients
          x11vnc -display $DISPLAY -nopw -forever -shared -rfbport 5900 &>/tmp/x11vnc.log &

      - name: Start tmate (open interactive session to access the runner)
        uses: mxschmitt/action-tmate@v4
        with:
          wait-for-connection: true

      - name: Run Playwright tests (headed)
        run: |
          export DISPLAY=:99
          npx playwright test tests/sidebarNavigation.spec.ts --headed --timeout=120000
